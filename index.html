<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    background-color: #0a0e1a;
    font-family: 'Inter', sans-serif;
    color: white;
    scroll-behavior: smooth;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
    pointer-events: none;
}

.glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
    animation: float-glow 20s ease-in-out infinite;
}

.glow-1 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.6) 0%, transparent 70%);
    top: 10%;
    left: 20%;
    animation-delay: 0s;
}

.glow-2 {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.5) 0%, transparent 70%);
    top: 50%;
    right: 10%;
    animation-delay: -7s;
}

.glow-3 {
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
    bottom: 20%;
    left: 30%;
    animation-delay: -14s;
}

@keyframes float-glow {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }
    33% {
        transform: translate(50px, -50px) scale(1.1);
    }
    66% {
        transform: translate(-30px, 30px) scale(0.9);
    }
}

.content {
    position: relative;
    z-index: 1;
}

.main-section {
    min-height:100vh; 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    align-items:center; 
    position:relative;
    padding-top: 100px;
}

.main-heading {
    font-size:5.5rem; 
    font-weight:900; 
    text-align:center; 
    letter-spacing:1px;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #ffffff 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.features-text {
    color: #8b5cf6;
    font-size:0.9rem; 
    font-weight:bold; 
    text-align:center; 
    letter-spacing:0.3em; 
    margin:10px 0 30px;
    text-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
}

.auth-button {
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    color:white; 
    border:none; 
    padding:14px 45px; 
    font-size:1rem; 
    font-weight:bold; 
    border-radius:50px; 
    cursor:pointer; 
    overflow:hidden; 
    transition: all 0.3s ease; 
    position:relative; 
    letter-spacing:0.5px;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
}

.auth-button::before {
    content:''; 
    position:absolute; 
    top:0; 
    left:-100%; 
    width:100%; 
    height:100%; 
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); 
    transition:left 0.6s ease;
}

.auth-button:hover::before {left:100%;}
.auth-button:hover {
    box-shadow: 0 8px 40px rgba(139, 92, 246, 0.6);
    transform: translateY(-2px);
}

.staff-section {
    padding:120px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position: relative;
}

.staff-heading {
    font-size:4rem;
    font-weight:900;
    margin-bottom:50px;
    text-align:center;
    background: linear-gradient(180deg, #ffffff 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.staff-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    max-width: 1200px;
    width: 100%;
    flex-wrap: wrap;
}

.staff-member {
    background: rgba(17, 20, 41, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 320px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
}

.staff-member:hover {
    transform: translateY(-10px);
    box-shadow: 0 12px 40px rgba(139, 92, 246, 0.4);
    border: 1px solid rgba(139, 92, 246, 0.5);
}

.member-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 25px;
    border: 3px solid rgba(139, 92, 246, 0.5);
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
}

.member-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.member-name {
    font-size: 1.8rem;
    font-weight: bold;
    color: #8b5cf6;
    margin-bottom: 10px;
}

.member-role {
    font-size: 1.1rem;
    color: #d1d5db;
    margin-bottom: 25px;
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
}

.social-icon {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(17, 20, 41, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(139, 92, 246, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.social-icon:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    background: rgba(139, 92, 246, 0.2);
}

.social-icon svg {
    width: 22px;
    height: 22px;
    fill: #8b5cf6;
}

.footer {
    background: rgba(17, 20, 41, 0.6);
    backdrop-filter: blur(10px);
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    bottom:0;
    width:100%;
    border-top: 1px solid rgba(139, 92, 246, 0.2);
}

.footer-left {
    display:flex;
    align-items:center;
    gap:10px;
}

.footer-left img {
    width:35px;
    height:35px;
}

.footer-left span {
    font-size:1.3rem;
    font-weight:bold;
}

.footer-right a {
    margin-left:20px;
    color:#d1d5db;
    text-decoration:none;
    font-weight:600;
    transition: all 0.3s ease;
    position: relative;
}

.footer-right a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #8b5cf6, #6366f1);
    transition: width 0.3s ease;
}

.footer-right a:hover {
    color:#8b5cf6;
}

.footer-right a:hover::after {
    width: 100%;
}

@media(max-width:900px){
    .main-heading {
        font-size: 3rem;
    }
    .staff-heading {
        font-size: 2.5rem;
    }
    .staff-container {
        gap: 20px;
    }
    .staff-member {
        width: 280px;
        padding: 20px;
    }
    .member-circle {
        width: 120px;
        height: 120px;
    }
    .footer {
        flex-direction: column;
        gap: 15px;
    }
    .footer-right a {
        margin: 0 10px;
    }
}
</style>
